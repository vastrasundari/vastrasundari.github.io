<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Vastra Sundari</title>
  <meta name="theme-color" content="#641B32">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/config.js"></script>
</head>
<body>
  <script src="assets/js/layout.js" data-part="header"></script>

  <main>
    <header class="vs-page-head">
      <p class="vs-kicker">Secure Checkout</p>
      <h1 class="vs-page-title mt-3">Checkout</h1>
    </header>

    <div class="container py-10 md:py-14" id="checkoutRoot">
      <form id="checkoutForm" novalidate class="grid gap-10 lg:grid-cols-[1fr_400px]">
        <div>
          <div id="formAlert" class="vs-alert mb-6 hidden" role="alert"></div>

          <fieldset>
            <legend class="font-display text-2xl text-burgundy">Contact details</legend>
            <div class="mt-5 grid gap-5 md:grid-cols-2">
              <div class="md:col-span-2">
                <label class="vs-label" for="full_name">Full name *</label>
                <input class="vs-input" id="full_name" name="full_name" autocomplete="name" required maxlength="100">
                <p class="vs-error hidden" data-err="full_name"></p>
              </div>
              <div>
                <label class="vs-label" for="phone">Mobile number *</label>
                <input class="vs-input" id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="10-digit mobile" required maxlength="14">
                <p class="vs-error hidden" data-err="phone"></p>
              </div>
              <div>
                <label class="vs-label" for="email">Email *</label>
                <input class="vs-input" id="email" name="email" type="email" autocomplete="email" required maxlength="254">
                <p class="vs-error hidden" data-err="email"></p>
              </div>
            </div>
          </fieldset>

          <fieldset class="mt-10">
            <legend class="font-display text-2xl text-burgundy">Delivery address</legend>
            <div class="mt-5 grid gap-5 md:grid-cols-2">
              <div class="md:col-span-2">
                <label class="vs-label" for="line1">House / flat, street, area *</label>
                <input class="vs-input" id="line1" name="line1" autocomplete="address-line1" required maxlength="200">
                <p class="vs-error hidden" data-err="line1"></p>
              </div>
              <div class="md:col-span-2">
                <label class="vs-label" for="line2">Landmark (optional)</label>
                <input class="vs-input" id="line2" name="line2" autocomplete="address-line2" maxlength="200">
                <p class="vs-error hidden" data-err="line2"></p>
              </div>
              <div>
                <label class="vs-label" for="city">City *</label>
                <select class="vs-input" id="city" name="city" autocomplete="address-level2" required></select>
                <p class="vs-error hidden" data-err="city"></p>
              </div>
              <div>
                <label class="vs-label" for="pincode">PIN code *</label>
                <input class="vs-input" id="pincode" name="pincode" inputmode="numeric" autocomplete="postal-code" required maxlength="6">
                <p class="vs-error hidden" data-err="pincode"></p>
              </div>
              <div class="md:col-span-2">
                <label class="vs-label" for="state">State *</label>
                <select class="vs-input" id="state" name="state" autocomplete="address-level1" required></select>
                <p class="vs-error hidden" data-err="state"></p>
                <p class="mt-2 text-xs text-charcoal/55">We currently deliver only to Rajkot, Jamnagar and Ahmedabad (Gujarat).</p>
              </div>
              <div class="md:col-span-2">
                <label class="vs-label" for="notes">Order notes (optional)</label>
                <textarea class="vs-input" id="notes" name="notes" rows="3" maxlength="500" placeholder="Delivery instructions, preferred time…"></textarea>
                <p class="vs-error hidden" data-err="notes"></p>
              </div>
              <!-- honeypot: hidden from people, bots tend to fill it -->
              <div class="hidden" aria-hidden="true">
                <label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off">
              </div>
            </div>
          </fieldset>

          <fieldset class="mt-10">
            <legend class="font-display text-2xl text-burgundy">Payment</legend>
            <div class="mt-5 grid gap-3" id="payOptions">
              <label class="vs-payopt" id="upiOption">
                <input type="radio" name="payment_method" value="upi" checked>
                <span><span class="block font-medium text-burgundy">UPI <span class="ml-1 text-xs font-normal text-charcoal/55">Google Pay · PhonePe · Paytm · BHIM</span></span>
                <span class="mt-1 block text-sm text-charcoal/65">After placing the order, scan the QR code or open your UPI app to pay, then enter the 12-digit UPI reference (UTR). We confirm your order once the payment reaches us.</span></span>
              </label>
            </div>
          </fieldset>
        </div>

        <aside class="h-fit bg-white p-6 ring-1 ring-gold/30 md:p-8 lg:sticky lg:top-40">
          <h2 class="font-display text-2xl text-burgundy">Your Order</h2>
          <ul class="mt-5 divide-y divide-charcoal/10" id="summaryItems"></ul>
          <dl class="mt-4 space-y-3 border-t border-charcoal/10 pt-4 text-sm">
            <div class="flex justify-between"><dt class="text-charcoal/70">Subtotal</dt><dd id="sumSubtotal"></dd></div>
            <div class="flex justify-between"><dt class="text-charcoal/70">Shipping</dt><dd>Complimentary</dd></div>
            <div class="flex justify-between border-t border-charcoal/10 pt-4 text-base font-medium"><dt id="sumTotalLabel">Total to pay by UPI</dt><dd class="text-burgundy" id="sumTotal"></dd></div>
          </dl>
          <button type="submit" class="vs-btn vs-btn--primary mt-6 w-full" id="placeBtn">Place Order &amp; Pay by UPI</button>
          <p class="mt-3 text-center text-xs text-charcoal/55">Final prices and availability are confirmed when you place the order.</p>
        </aside>
      </form>
    </div>
  </main>

  <script src="assets/js/layout.js" data-part="footer"></script>
  <script src="assets/js/main.js" defer></script>
  <script type="module">
    import { callFunction, isConfigured } from "./assets/js/lib/supabase.js";
    import { esc, inr, upiId } from "./assets/js/lib/util.js";
    import { getCart, clearCart, saveOrder } from "./assets/js/lib/cart.js";

    // Delivery area: Gujarat only, these three cities only (server enforces the same rules).
    const STATES = ["Gujarat"];
    const CITIES = { Rajkot: ["360"], Jamnagar: ["361"], Ahmedabad: ["380", "382"] };

    const items = getCart();
    if (!items.length) location.replace("cart.html");

    const form = document.getElementById("checkoutForm");
    const stateSel = document.getElementById("state");
    stateSel.innerHTML = STATES.map((s) => `<option selected>${s}</option>`).join("");
    document.getElementById("city").innerHTML = `<option value="">Select city</option>` + Object.keys(CITIES).map((c) => `<option>${c}</option>`).join("");

    // Order summary (display only; the server recalculates)
    const subtotal = items.reduce((n, i) => n + i.price * i.qty, 0);
    document.getElementById("summaryItems").innerHTML = items.map((i) => `
      <li class="flex justify-between gap-4 py-3 text-sm">
        <span><span class="font-display text-base">${esc(i.name)}</span><br>
        <span class="text-xs text-charcoal/55">Size ${esc(i.size)} · Qty ${i.qty}</span></span>
        <span class="whitespace-nowrap">${inr(i.price * i.qty)}</span></li>`).join("");
    document.getElementById("sumSubtotal").textContent = inr(subtotal);
    document.getElementById("sumTotal").textContent = inr(subtotal);

    // Payment: UPI only (Cash on Delivery is not offered). Needs UPI_ID in config.js.
    const placeLabel = () => "Place Order & Pay by UPI";

    // Client-side checks mirror the server rules (server remains the authority).
    const rules = {
      full_name: (v) => v.length >= 2 && /^[\p{L} .'-]+$/u.test(v) || "Please enter your full name.",
      phone: (v) => /^[6-9]\d{9}$/.test(v.replace(/\D/g, "").replace(/^(91|0)(?=\d{10}$)/, "")) || "Please enter a valid 10-digit Indian mobile number.",
      email: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) || "Please enter a valid email address.",
      line1: (v) => v.length >= 5 || "Please enter your full address.",
      city: (v) => Object.hasOwn(CITIES, v) || "We deliver only to Rajkot, Jamnagar and Ahmedabad.",
      pincode: (v) => {
        if (!/^[1-9]\d{5}$/.test(v)) return "Please enter a valid 6-digit PIN code.";
        const city = document.getElementById("city").value;
        return !Object.hasOwn(CITIES, city) || CITIES[city].some((p) => v.startsWith(p)) || `This PIN code is not in ${city}.`;
      },
      state: (v) => STATES.includes(v) || "We deliver only within Gujarat.",
    };

    function showErrors(errs) {
      form.querySelectorAll("[data-err]").forEach((p) => {
        const k = p.dataset.err;
        const field = document.getElementById(k);
        if (errs[k]) { p.textContent = errs[k]; p.classList.remove("hidden"); field?.setAttribute("aria-invalid", "true"); }
        else { p.classList.add("hidden"); field?.removeAttribute("aria-invalid"); }
      });
      const first = Object.keys(errs).find((k) => document.getElementById(k));
      if (first) document.getElementById(first).focus();
    }

    const alertBox = document.getElementById("formAlert");
    const showAlert = (html) => { alertBox.innerHTML = html; alertBox.classList.remove("hidden"); alertBox.scrollIntoView({ behavior: "smooth", block: "center" }); };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.add("hidden");
      const f = Object.fromEntries(new FormData(form).entries());
      for (const k in f) f[k] = String(f[k]).trim();

      const errs = {};
      for (const [k, fn] of Object.entries(rules)) { const r = fn(f[k] || ""); if (r !== true) errs[k] = r; }
      showErrors(errs);
      if (Object.keys(errs).length) return;

      if (!isConfigured || !upiId()) { showAlert("Online ordering is not available yet. Please contact us to place your order."); return; }

      const btn = document.getElementById("placeBtn");
      btn.disabled = true;
      btn.innerHTML = `<span class="vs-spinner"></span> Placing order…`;
      try {
        const res = await callFunction("place-order", {
          customer: { full_name: f.full_name, email: f.email, phone: f.phone },
          address: { line1: f.line1, line2: f.line2, city: f.city, state: f.state, pincode: f.pincode },
          notes: f.notes,
          website: f.website,
          payment_method: "upi",
          items: getCart().map((i) => ({ size_id: i.sizeId, quantity: i.qty })),
        });
        saveOrder(res.order_number, res.access_token);
        clearCart();
        location.replace(`order.html?no=${encodeURIComponent(res.order_number)}&t=${encodeURIComponent(res.access_token)}&new=1`);
      } catch (err) {
        if (err.fields) showErrors(err.fields);
        const bagLink = err.status === 409 ? ` <a href="cart.html" class="underline underline-offset-4">Review your bag</a>` : "";
        showAlert(esc(err.message) + bagLink);
        btn.disabled = false;
        btn.textContent = placeLabel();
      }
    });
  </script>
</body>
</html>
