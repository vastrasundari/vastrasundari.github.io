<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Order | Vastra Sundari</title>
  <meta name="theme-color" content="#641B32">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/config.js"></script>
</head>
<body>
  <script src="assets/js/layout.js" data-part="header"></script>

  <main class="container max-w-4xl py-10 md:py-16" id="orderRoot">
    <div class="py-24 text-center text-burgundy"><span class="vs-spinner"></span></div>
  </main>

  <script src="assets/js/layout.js" data-part="footer"></script>
  <script src="assets/js/main.js" defer></script>
  <script type="module">
    import { callFunction } from "./assets/js/lib/supabase.js";
    import { esc, inr, qs, formatDate, STATUS_LABEL, PAYMENT_LABEL, imageFallback } from "./assets/js/lib/util.js";
    import { getSavedOrders, saveOrder } from "./assets/js/lib/cart.js";

    const root = document.getElementById("orderRoot");
    const no = qs("no");
    const token = qs("t");
    const isNew = qs("new") === "1";

    if (!no || !token) renderList();
    else {
      try {
        const { order } = await callFunction("get-order", { order_number: no, token });
        saveOrder(order.order_number, token); // remember on this device (e.g. opened from email)
        renderOrder(order);
      } catch (e) {
        root.innerHTML = `<div class="vs-empty"><p class="font-display text-3xl text-burgundy">We couldn't find that order</p>
          <p class="mt-2 text-sm text-charcoal/60">${esc(e.status === 404 ? "Please use the link from your order email." : e.message)}</p>
          <a href="order.html" class="vs-btn vs-btn--outline mt-6">My orders</a></div>`;
      }
    }

    function renderList() {
      const saved = getSavedOrders();
      root.innerHTML = `
        <div class="text-center">
          <p class="vs-kicker">My Orders</p>
          <h1 class="vs-page-title mt-3">Track your order</h1>
          <p class="mx-auto mt-3 max-w-md text-sm text-charcoal/65">Open the “View your order” link in your confirmation email to see the latest status from any device.</p>
        </div>
        ${saved.length ? `
          <div class="mt-10 bg-white ring-1 ring-gold/30">
            <p class="border-b border-charcoal/10 px-6 py-4 text-xs uppercase tracking-[.18em] text-charcoal/55">Orders placed on this device</p>
            <ul class="divide-y divide-charcoal/10">
              ${saved.map((o) => `<li><a class="flex items-center justify-between px-6 py-4 hover:bg-ivory" href="order.html?no=${encodeURIComponent(o.order_number)}&t=${encodeURIComponent(o.token)}">
                <span class="font-display text-lg text-burgundy">${esc(o.order_number)}</span>
                <span class="text-xs text-charcoal/55">${formatDate(o.at, false)} →</span></a></li>`).join("")}
            </ul>
          </div>` : `<div class="mt-10 text-center"><a href="shop.html" class="vs-btn vs-btn--primary">Explore Collection</a></div>`}`;
    }

    function renderOrder(o) {
      const steps = ["order_received", "confirmed", "shipped", "delivered"];
      const cancelled = o.status === "cancelled";
      const reached = steps.indexOf(o.status);

      root.innerHTML = `
        <div class="text-center">
          ${isNew ? `<div class="mx-auto mb-6 grid h-16 w-16 place-items-center rounded-full bg-burgundy text-gold">
            <svg viewBox="0 0 24 24" class="h-8 w-8" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>` : ""}
          <p class="vs-kicker">${isNew ? "Thank you" : "Order details"}</p>
          <h1 class="vs-page-title mt-3">${isNew ? "Your order is placed" : esc(o.order_number)}</h1>
          <p class="mt-3 text-sm text-charcoal/65">
            ${isNew ? `Order <strong class="text-burgundy">${esc(o.order_number)}</strong> · a confirmation email is on its way.` : `Placed on ${formatDate(o.created_at)}`}
          </p>
        </div>

        <section class="mt-10 bg-white p-6 ring-1 ring-gold/30 md:p-8" aria-label="Order status">
          ${cancelled
            ? `<p class="font-display text-xl text-maroon">This order has been cancelled</p>${o.cancel_reason ? `<p class="mt-1 text-sm text-charcoal/65">${esc(o.cancel_reason)}</p>` : ""}`
            : `<ol class="grid grid-cols-4 gap-2">
                ${steps.map((s, i) => `<li class="text-center">
                  <div class="mx-auto h-1.5 ${i <= reached ? "bg-burgundy" : "bg-charcoal/10"}"></div>
                  <p class="mt-3 text-[10.5px] uppercase tracking-[.14em] md:text-xs ${i <= reached ? "text-burgundy font-medium" : "text-charcoal/45"}">${STATUS_LABEL[s]}</p></li>`).join("")}
              </ol>
              ${o.status === "shipped" && (o.courier_name || o.tracking_number) ? `<p class="mt-6 text-sm"><span class="text-charcoal/60">Courier:</span> ${esc(o.courier_name || "—")} &nbsp;·&nbsp; <span class="text-charcoal/60">Tracking:</span> ${esc(o.tracking_number || "—")}</p>` : ""}`}
          <p class="mt-6 text-sm"><span class="text-charcoal/60">Payment:</span> Cash on Delivery — ${PAYMENT_LABEL[o.payment_status]}</p>
        </section>

        <div class="mt-8 grid gap-8 md:grid-cols-[1fr_280px]">
          <section class="bg-white p-6 ring-1 ring-gold/30 md:p-8">
            <h2 class="font-display text-xl text-burgundy">Items</h2>
            <ul class="mt-4 divide-y divide-charcoal/10">
              ${o.order_items.map((i) => `<li class="flex gap-4 py-4">
                <div class="aspect-[3/4] w-16 shrink-0 overflow-hidden bg-[#f1ead9]">${i.image_url ? `<img src="${esc(i.image_url)}" alt="" class="h-full w-full object-cover">` : imageFallback(i.product_name)}</div>
                <div class="flex-1"><p class="font-display">${esc(i.product_name)}</p>
                  <p class="text-xs text-charcoal/55">Size ${esc(i.size_label)} · Qty ${i.quantity} · ${inr(i.unit_price)} each</p></div>
                <p class="whitespace-nowrap text-sm">${inr(i.line_total)}</p></li>`).join("")}
            </ul>
            <dl class="mt-2 space-y-2 border-t border-charcoal/10 pt-4 text-sm">
              <div class="flex justify-between"><dt class="text-charcoal/65">Subtotal</dt><dd>${inr(o.subtotal)}</dd></div>
              <div class="flex justify-between"><dt class="text-charcoal/65">Shipping</dt><dd>${Number(o.shipping_fee) ? inr(o.shipping_fee) : "Complimentary"}</dd></div>
              <div class="flex justify-between pt-2 text-base font-medium"><dt>Total (COD)</dt><dd class="text-burgundy">${inr(o.total)}</dd></div>
            </dl>
          </section>
          <section class="h-fit bg-white p-6 ring-1 ring-gold/30">
            <h2 class="font-display text-xl text-burgundy">Delivering to</h2>
            <address class="mt-3 text-sm not-italic leading-6 text-charcoal/80">
              ${esc(o.customer_name)}<br>${esc(o.address_line1)}<br>${o.address_line2 ? esc(o.address_line2) + "<br>" : ""}
              ${esc(o.city)}, ${esc(o.state)} ${esc(o.pincode)}
            </address>
          </section>
        </div>
        <div class="mt-10 text-center"><a href="shop.html" class="vs-btn vs-btn--outline">Continue Shopping</a></div>`;
    }
  </script>
</body>
</html>
